name: Feature request
description: Suggest something Canvos should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Canvos help?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
