name: Release

# Push a tag like v1.0.1 to build a signed APK and draft a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CANVOS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret CANVOS_KEYSTORE_BASE64 is not set. See README > Publishing a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CANVOS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        env:
          CANVOS_KEYSTORE_PASSWORD: ${{ secrets.CANVOS_KEYSTORE_PASSWORD }}
          CANVOS_KEY_ALIAS: ${{ secrets.CANVOS_KEY_ALIAS }}
          CANVOS_KEY_PASSWORD: ${{ secrets.CANVOS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*-release.apk "dist/canvos-${GITHUB_REF_NAME#v}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt
          CERT=$("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs canvos-*.apk 2>/dev/null | grep -m1 'SHA-256' | sed 's/.*: //') || true
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed.

            **Signing certificate SHA-256:** `${{ env.CERT_SHA256 }}`
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
